[project]
name = "codeswarm-agent"
version = "0.1.0"
description = "Manager-led coding agent with checkpointed execution and test-based verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.86.0",
    "anthropic>=0.54.0,<=0.60.0",
    "click>=8.0.0",
    "google-genai>=1.24.0",
    "jsonpath-ng>=1.7.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typing-extensions>=4.0.0",
    "ollama>=0.5.1",
    "socksio>=1.0.0",
    "tree-sitter-languages==1.10.2",
    "tree-sitter==0.21.3",
    "mcp==1.12.2",
    "jsonschema>=4.20.0,<5",
    "asyncclick>=8.0.0",
    "pyyaml>=6.0.2",
    "textual>=0.50.0",
    "docker>=7.1.0",
    "pexpect>=4.9.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langsmith==0.14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=4.2.0",
]
context-ml = [
    "sentence-transformers>=3.0.0,<4",
    "torch>=2.2.0",
]
context-ann = [
    "usearch>=2.26,<3",
]
context-qwen = [
    "transformers>=4.51.0,<6",
    "torch>=2.2.0",
]
observability = [
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "openinference-semantic-conventions==0.1.44",
]
windows-guarded = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
codeswarm-cli = "codeagent.cli:main"
codeswarm-eval = "codeagent.evaluation.cli:main"
codeswarm-doctor = "codeagent.doctor:main"
codeswarm-mcp = "codeagent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trae_agent", "codeagent"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "ann_benchmark: opt-in real USearch recall and 10k-chunk latency benchmark",
]

[tool.coverage.run]
source = ["trae_agent", "codeagent"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "SIM",
    "C4",
    "E4", "E9", "E7", "F",
    "I"
]

[dependency-groups]
dev = [
    "ruff>=0.12.4",
    "types-pyyaml>=6.0.12.20250516",
]
